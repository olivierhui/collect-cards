<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>收集卡系列 · 展示柜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@500;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=auto-cabinet" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute;overflow:hidden">
    <defs>
      <g id="filigree-corner" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 74 C8 40 8 22 22 13 C36 6 56 6 78 6" stroke-width="1.45"/>
        <path d="M16 74 C16 44 16 28 28 20 C40 14 56 14 78 14" stroke-width="0.85" opacity=".7"/>
        <path d="M22 22 C12 12 22 4 34 11" stroke-width="1.2"/>
        <path d="M22 22 C12 32 4 22 11 34" stroke-width="1.2"/>
        <path d="M36 12 C44 6 52 10 50 18 C48 24 40 22 38 16" stroke-width="0.9"/>
        <path d="M12 36 C6 44 10 52 18 50 C24 48 22 40 16 38" stroke-width="0.9"/>
        <path d="M58 8 C64 16 74 14 78 10" stroke-width="0.8" opacity=".85"/>
        <path d="M8 58 C16 64 14 74 10 78" stroke-width="0.8" opacity=".85"/>
        <circle cx="22" cy="22" r="1.7" fill="currentColor" stroke="none"/>
        <circle cx="50" cy="10" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="50" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="68" cy="10" r="0.8" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="68" r="0.8" fill="currentColor" stroke="none"/>
      </g>
      <g id="filigree-mid" fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M8 16 C20 6 32 6 40 16 C48 6 60 6 72 16" stroke-width="1.15"/>
        <path d="M26 16 C32 8 40 8 40 14 C40 8 48 8 54 16" stroke-width="0.85"/>
        <circle cx="40" cy="10" r="1.3" fill="currentColor" stroke="none"/>
      </g>
    </defs>
  </svg>

  <header class="top">
    <div>
      <p class="kicker">18ANIME GIRLS</p>
      <h1>个人典藏柜</h1>
    </div>
    <div class="top-actions" id="top-actions"></div>
  </header>

  <section class="status-bar" id="status-bar"></section>
  <section class="gate" id="gate">
    <p>登录后打开你的个人典藏柜。当天仍在订的会员，卡会自动入柜。</p>
  </section>
  <main class="cabinet hidden" id="cabinet"></main>

  <div class="overlay hidden" id="overlay">
    <div class="viewer">
      <button class="close" id="close-viewer" type="button">关闭</button>
      <div class="viewer-stage" id="viewer-stage"></div>
      <div class="viewer-side">
        <h2 id="viewer-title"></h2>
        <p class="muted" id="viewer-code"></p>
        <div class="stack" id="viewer-stack"></div>
        <div class="row">
          <button type="button" id="btn-cover">设为柜面</button>
          <button type="button" id="btn-phone">手机壁纸</button>
          <button type="button" id="btn-desk">电脑壁纸</button>
        </div>
        <p class="muted tiny">移动鼠标看眼神 · 点胸部会弹 · 点卡翻面。壁纸是静图，互动在柜里永远还在。</p>
      </div>
    </div>
  </div>

  <script src="/static/card.js?v=studio-preview"></script>
  <script src="/static/app.js?v=auto-cabinet"></script>
</body>
</html>
