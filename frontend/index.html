<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>收集卡系列 · 展示柜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+SC:wght@500;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=post" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute;overflow:hidden">
    <defs>
      <g id="filigree-corner" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 74 C8 40 8 22 22 13 C36 6 56 6 78 6" stroke-width="1.45"/>
        <path d="M16 74 C16 44 16 28 28 20 C40 14 56 14 78 14" stroke-width="0.85" opacity=".7"/>
        <path d="M22 22 C12 12 22 4 34 11" stroke-width="1.2"/>
        <path d="M22 22 C12 32 4 22 11 34" stroke-width="1.2"/>
        <path d="M36 12 C44 6 52 10 50 18 C48 24 40 22 38 16" stroke-width="0.9"/>
        <path d="M12 36 C6 44 10 52 18 50 C24 48 22 40 16 38" stroke-width="0.9"/>
        <path d="M58 8 C64 16 74 14 78 10" stroke-width="0.8" opacity=".85"/>
        <path d="M8 58 C16 64 14 74 10 78" stroke-width="0.8" opacity=".85"/>
        <circle cx="22" cy="22" r="1.7" fill="currentColor" stroke="none"/>
        <circle cx="50" cy="10" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="50" r="1.15" fill="currentColor" stroke="none"/>
        <circle cx="68" cy="10" r="0.8" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="68" r="0.8" fill="currentColor" stroke="none"/>
      </g>
      <g id="filigree-mid" fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M8 16 C20 6 32 6 40 16 C48 6 60 6 72 16" stroke-width="1.15"/>
        <path d="M26 16 C32 8 40 8 40 14 C40 8 48 8 54 16" stroke-width="0.85"/>
        <circle cx="40" cy="10" r="1.3" fill="currentColor" stroke="none"/>
      </g>
    </defs>
  </svg>

  <header class="top">
    <div>
      <p class="kicker">18ANIME GIRLS</p>
      <div class="shelf-drop">
        <button type="button" class="shelf-btn" id="shelf-btn" aria-expanded="false">
          <span id="shelf-label">个人典藏柜</span>
          <span class="shelf-caret" aria-hidden="true"></span>
        </button>
        <div class="shelf-menu hidden" id="shelf-menu">
          <button type="button" data-shelf="cabinet">个人典藏柜</button>
          <button type="button" data-shelf="memorial">纪念组</button>
        </div>
      </div>
    </div>
    <div class="top-actions" id="top-actions"></div>
  </header>

  <section class="status-bar" id="status-bar" data-block="status"></section>
  <section class="gate" id="gate" data-block="gate">
    <p>登录后打开你的个人典藏柜。当天仍在订的会员，卡会自动入柜。</p>
  </section>
  <section class="page-note hidden" id="page-note" data-block="note">
    <p id="ed-note"></p>
  </section>
  <main class="cabinet hidden" id="cabinet" data-block="cabinet"></main>
  <section class="memorial-wrap hidden" id="memorial-wrap" data-block="memorial">
    <h2 class="mem-title hidden" id="mem-title">纪念组</h2>
    <div class="cabinet mem-grid" id="memorial"></div>
  </section>

  <button type="button" class="ed-enter hidden" id="ed-enter">编辑页面</button>
  <div class="ed-bar hidden" id="ed-bar">
    <strong>页面编辑</strong>
    <span class="ed-dirty" id="ed-dirty" hidden>未保存</span>
    <button type="button" id="ed-open-lib">卡片库</button>
    <button type="button" id="ed-bar-fix">投放纠错</button>
    <button type="button" data-hide-block="status">显隐状态栏</button>
    <button type="button" data-hide-block="note">显隐公告</button>
    <button type="button" data-hide-block="memorial">显隐纪念组</button>
    <button type="button" id="ed-mods">属性模块</button>
    <button type="button" class="primary" id="ed-save">保存</button>
    <button type="button" id="ed-quit">退出编辑</button>
    <span class="muted tiny" id="ed-status"></span>
  </div>
  <aside class="ed-drawer hidden" id="ed-drawer"></aside>
  <aside class="ed-lib hidden" id="ed-lib">
    <header>
      <h3>卡片库</h3>
      <p class="muted tiny">拖到格子上投放，或点开纠错。</p>
    </header>
    <input id="ed-lib-q" placeholder="搜编号或名字" />
    <div id="ed-lib-list"></div>
  </aside>
  <div class="ed-fix hidden" id="ed-fix">
    <div class="ed-fix-card">
      <header>
        <h3>投放纠错</h3>
        <button type="button" id="ed-fix-close">关闭</button>
      </header>
      <p class="muted tiny" id="ed-fix-msg">投放错了：改编号、改日期、或撤销。已入柜的可以只改名单，或从所有人柜里收回。</p>
      <label>现在的编号 <input id="ed-fix-code" placeholder="S1-001-1" /></label>
      <label>原投放日 <input id="ed-fix-day" type="date" /></label>
      <label>动作
        <select id="ed-fix-action">
          <option value="remove">撤销投放</option>
          <option value="reassign">改成另一张（改编号）</option>
          <option value="move">改投放日期</option>
        </select>
      </label>
      <label>新编号（改编号时填） <input id="ed-fix-newcode" placeholder="S1-002-1" /></label>
      <label>新日期（改日期时填） <input id="ed-fix-newday" type="date" /></label>
      <label>已经拿到的人
        <select id="ed-fix-inv">
          <option value="keep">只改名单，柜里先留着</option>
          <option value="recall">从所有人柜里收回这张</option>
          <option value="swap">收回旧的，给同批人补上新编号</option>
        </select>
      </label>
      <p class="muted tiny" id="ed-fix-impact"></p>
      <button type="button" class="primary" id="ed-fix-go">执行</button>
    </div>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="float-stage" id="float-stage">
      <div class="viewer-strip" id="viewer-strip"></div>
      <div class="float-card" id="viewer-stage"></div>
      <button type="button" class="cover-fab" id="btn-cover" data-mod="propCover">设为封面</button>
    </div>
    <button type="button" class="ov-chip" id="btn-hide-info">属性</button>
    <button type="button" class="ov-chip ov-close" id="close-viewer">关闭</button>
    <aside class="prop-sheet" id="viewer-side">
      <header class="prop-head" data-mod="propTitle">
        <h2 id="viewer-title"></h2>
        <button type="button" class="prop-x" id="btn-hide-info-x" aria-label="收起属性">收起</button>
      </header>
      <p class="muted" id="viewer-code" data-mod="propCode"></p>
      <a class="prop-link hidden" id="prop-collection" href="#" target="_blank" rel="noopener noreferrer" data-mod="propCollection">打开 Patreon full set</a>
      <div class="prop-tools" data-mod="propWallpaper">
        <button type="button" id="btn-phone">手机壁纸</button>
        <button type="button" id="btn-desk">电脑壁纸</button>
      </div>
      <p class="muted tiny" id="viewer-hint" data-mod="propHint">滚轮缩放 · 右键返回 · 点击胸部跳动</p>
    </aside>
  </div>

  <script src="/static/i18n.js?v=fullset1"></script>
  <script src="/static/card.js?v=fullset1"></script>
  <script src="/static/app.js?v=fullset1"></script>
  <script src="/static/editor.js?v=fullset1"></script>
</body>
</html>
